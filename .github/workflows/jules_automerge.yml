name: 1. Auto-Validate and Merge Jules PRs

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.login == 'google-jules[bot]' ||
      github.event.pull_request.user.login == 'coruhoorhan'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "🛡️ Step 1: Magda AI Independent Code Auditor Quality Gate"
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.inceptionlabs.ai/v1
          OPENAI_MODEL: mercury-2
        run: |
          python3 scripts/pr_code_auditor.py ${{ github.event.pull_request.number }} ${{ github.repository }}

      - name: "🔍 Step 2: Validate agent task manifest"
        run: python3 scripts/validate_agent_tasks.py agent_tasks.json

      - name: "📦 Step 3: Install dependencies & Run pytest"
        run: |
          pip install pytest pytest-asyncio
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pytest -q

      - name: "✅ Step 4: Auto-approve and Merge PR (Only if Quality Gate & Tests Passed)"
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr review ${{ github.event.pull_request.number }} --approve || true
          gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch || true
