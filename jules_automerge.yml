name: 1. Auto-Validate and Merge Jules PRs

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-merge:
    runs-on: ubuntu-latest
    # Запускаем только если PR создан ботом Jules
    if: github.event.pull_request.user.login == 'google-jules[bot]' || contains(github.event.pull_request.labels.*.name, 'jules')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Если для тестов нужны дополнительные пакеты, ставим их сюда

      - name: Validate agent task manifest
        run: python scripts/validate_agent_tasks.py agent_tasks.json

      - name: Run test suite
        run: |
          pytest

      - name: Auto-approve and Merge PR
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Автоматическое одобрение изменений
          gh pr review ${{ github.event.pull_request.number }} --approve
          # Слияние ветки и удаление временной ветки агента
          gh pr merge ${{ github.event.pull_request.number }} --merge --delete-branch

      - name: Mark task done on merge
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          TITLE=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/$REPO/pulls/$PR_NUM | python -c "import sys, json; print(json.load(sys.stdin)['title'])")
          TASK_ID=$(echo "$TITLE" | awk '{print $1}')
          CONTENT=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/$REPO/contents/agent_tasks.json)
          SHA=$(echo "$CONTENT" | python -c "import sys, json; print(json.load(sys.stdin)['sha'])")
          FILE=$(echo "$CONTENT" | python -c "import sys, json, base64; data=json.load(sys.stdin)['content']; print(base64.b64decode(data).decode())")
          python - <<PY
import json, sys
data = json.loads("""$FILE""")
for t in data.get('tasks', []):
    if t.get('id') == "$TASK_ID":
        t['status'] = 'done'
print(json.dumps(data, indent=2))
PY > new.json
          NEW_CONTENT=$(base64 -w0 new.json)
          curl -X PUT -H "Authorization: token $GH_TOKEN" \
            -d "{\"message\":\"Mark $TASK_ID done\",\"content\":\"$NEW_CONTENT\",\"sha\":\"$SHA\"}" \
            https://api.github.com/repos/$REPO/contents/agent_tasks.json